# ─── DeepInsight 知识库：学术框架定义 ────────────────────────────
# 每个框架包含：理论基础、量化指标、测量方法、解释规则、文献引用
# 引擎从原始活动数据中计算量化指标，AI 只负责自然语言解读
# ───────────────────────────────────────────────────────────────

frameworks:

  # ━━━ 1. 心流理论 (Flow Theory) ━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: flow_theory
    name: 心流理论
    name_en: Flow Theory
    field: 工作心理学
    scholar: Mihaly Csikszentmihalyi
    year: 1990
    source_book: "Flow: The Psychology of Optimal Experience"
    core_concept: |
      当个体的技能水平与面临的挑战相匹配时，会进入一种全神贯注、忘我投入的"心流"状态。
      心流状态的特征：①清晰的目标 ②即时反馈 ③挑战与技能平衡 ④行动与意识融合
      ⑤专注力集中 ⑥控制感 ⑦自我意识消失 ⑧时间感改变 ⑨自成性体验
    metrics:
      - id: flow_index
        name: 心流指数
        formula: "连续同任务时长(分) / sqrt(任务切换次数+1) * 专注度权重"
        range: [0, 100]
        interpretation:
          high: ">=60: 深度沉浸，可能处于心流状态"
          medium: "30-59: 部分专注，有进入心流的潜力"
          low: "<30: 注意力分散，难以进入心流"
      - id: focus_continuity
        name: 专注连续性
        formula: "最长未打断专注段(分) / 总工作时长(分)"
        range: [0, 1]
      - id: context_switch_cost
        name: 上下文切换代价
        formula: "切换次数 * 平均恢复时间(23分钟,参考Mark et al. 2008) / 总工作时长"
        range: [0, 1]
    data_signals:
      - "连续同类活动>25分钟 → 心流候选段"
      - "5分钟内3次以上切换应用 → 注意力碎片化"
      - "深夜(22-2)长时间开发 → 可能心流但需警惕过度"
    insights_templates:
      high_flow: "今天有{flow_minutes}分钟的心流体验，这表明你当前任务的挑战度与技能匹配良好。Csikszentmihalyi指出心流状态是内在动机的核心来源。"
      fragmented: "今日任务切换{switch_count}次，每次切换平均需要23分钟恢复注意力(Mark et al., 2008)，累计损失约{lost_minutes}分钟。建议使用时间块(Time Boxing)策略。"
      challenge_skill: "心流理论强调挑战-技能平衡：当前你的{category}活动集中在熟悉操作区，适当增加挑战性任务(如新技术学习)有助于激发心流。"

  # ━━━ 2. 刻意练习 (Deliberate Practice) ━━━━━━━━━━━━━━━━━━━
  - id: deliberate_practice
    name: 刻意练习
    name_en: Deliberate Practice
    field: 学习科学/专业技能发展
    scholar: K. Anders Ericsson
    year: 1993
    source_paper: "The Role of Deliberate Practice in the Acquisition of Expert Performance, Psychological Review"
    core_concept: |
      Ericsson的研究表明，专家与新手的差异不在天赋，而在"刻意练习"的累积量。
      刻意练习的四个条件：①有明确的目标 ②在舒适区之外(学习区) ③有即时反馈 ④大量重复
      非刻意练习包括：机械重复(舒适区)、无反馈的练习、被动接受信息
      10,000小时定律源自此研究，但Ericsson本人强调质量>数量。
    metrics:
      - id: deliberate_ratio
        name: 刻意练习比
        formula: "(学习区活动时长 + 新工具/新领域时长) / 总工作时长"
        range: [0, 1]
        interpretation:
          high: ">=0.3: 刻意练习比例健康，持续成长中"
          medium: "0.15-0.29: 有学习但偏少，可能停滞在舒适区"
          low: "<0.15: 主要在舒适区操作，长期可能导致技能停滞"
      - id: comfort_zone_ratio
        name: 舒适区占比
        formula: "重复性/熟悉任务时长 / 总工作时长"
        range: [0, 1]
      - id: skill_accumulation_hours
        name: 技能累积小时数
        formula: "SUM(历史刻意练习时长)"
        range: [0, 10000]
    data_signals:
      - "连续多日同一工具同一操作模式 → 舒适区信号"
      - "出现新工具/新分类 → 学习区信号"
      - "学习分类下有活动 → 刻意练习候选"
      - "短期高频搜索+编码交替 → 知识建构信号"
    insights_templates:
      low_deliberate: "今日刻意练习比为{ratio:.0%}，主要时间花费在熟悉操作上。Ericsson(1993)指出，仅在'学习区'的练习才能带来技能提升，舒适区的重复无法产生新的神经适应性。"
      skill_growth: "累计{hours}小时的技能积累，按Ericsson的研究，达到领域专家通常需要10,000小时刻意练习。你当前的学习节奏预计在{years}年后达到专家水平。"
      new_territory: "检测到你在探索{new_area}，这属于学习区活动。刻意练习理论表明，适度的不适感(约15%的错误率)是技能增长的最佳区间。"

  # ━━━ 3. 布鲁姆认知分类 (Bloom's Taxonomy) ━━━━━━━━━━━━━━━━━
  - id: bloom_taxonomy
    name: 布鲁姆认知分类
    name_en: Bloom's Revised Taxonomy
    field: 教育心理学
    scholar: Benjamin Bloom (1956) / Lorin Anderson (2001修订)
    year: 2001
    source_book: "A Taxonomy for Learning, Teaching, and Assessing"
    core_concept: |
      布鲁姆将认知过程分为6个由低到高的层级：
      L1 记忆(Remember) — 识别、回忆事实
      L2 理解(Understand) — 解释、分类、总结
      L3 应用(Apply) — 执行、实施已知方法
      L4 分析(Analyze) — 区分、组织、归因
      L5 评价(Evaluate) — 检查、批判、评判
      L6 创造(Create) — 生成、设计、建构
      高阶思维(L4-L6)是深度学习和创新的关键。
    metrics:
      - id: cognitive_depth
        name: 认知深度评分
        formula: "加权平均(W*L1 + W*L2 + ... + W*L6)，L4-L6权重更高"
        range: [1, 6]
        interpretation:
          deep: ">=4.0: 高阶思维主导，属于深度学习和创造性工作"
          medium: "2.5-3.9: 中阶思维，以应用和理解为主"
          surface: "<2.5: 低阶思维为主，以记忆和被动接受为主"
      - id: higher_order_ratio
        name: 高阶思维占比
        formula: "(L4+L5+L6的时长) / 总工作时长"
        range: [0, 1]
    data_signals:
      - "阅读文档/邮件 → L1-L2(记忆/理解)"
      - "执行已知编码模式 → L3(应用)"
      - "调试/代码审查/Data分析 → L4(分析)"
      - "架构设计/性能优化决策 → L5(评价)"
      - "新项目创建/设计UI/写新算法 → L6(创造)"
    bloom_mapping:
      开发: { primary: L3, secondary: L6, note: "重复开发=L3，新架构/新算法=L6" }
      会议: { primary: L2, secondary: L4, note: "汇报=L2，讨论方案=L4" }
      沟通: { primary: L2, secondary: L5, note: "传达信息=L2，说服谈判=L5" }
      文档: { primary: L2, secondary: L5, note: "记录=L2，评审文档=L5" }
      测试: { primary: L3, secondary: L4, note: "执行测试=L3，分析失败原因=L4" }
      设计: { primary: L6, secondary: L5, note: "创意产出=L6，设计评审=L5" }
      运维: { primary: L3, secondary: L4, note: "执行操作=L3，故障排查=L4" }
      数据分析: { primary: L4, secondary: L5, note: "数据处理=L4，洞察发现=L5" }
      学习: { primary: L2, secondary: L3, note: "听课=L2，练习=L3" }
      管理: { primary: L5, secondary: L2, note: "决策=L5，信息传递=L2" }
      产品: { primary: L5, secondary: L6, note: "需求评估=L5，产品创新=L6" }
      生活: { primary: L1, secondary: L2, note: "日常事务=低阶认知" }
    insights_templates:
      low_bloom: "今日认知深度{depth}/6，主要集中在L{level}({level_name})。Anderson(2001)的修订版布鲁姆分类表明，长期停留在低阶思维会导致知识固化。建议增加分析和创造性任务。"
      high_bloom: "今日高阶思维占比{ratio:.0%}，认知深度{depth}/6。这表明你正在进行真正的深度认知工作，而非机械性操作。"
      bloom_imbalance: "L3(应用)占比较高但缺乏L6(创造)活动，这意味着你在'做'但不在'创'。尝试将20%的时间投入探索性/创造性项目。"

  # ━━━ 4. 自我决定理论 (Self-Determination Theory) ━━━━━━━━━
  - id: self_determination
    name: 自我决定理论
    name_en: Self-Determination Theory
    field: 动机心理学
    scholar: Edward L. Deci & Richard M. Ryan
    year: 1985
    source_book: "Intrinsic Motivation and Self-Determination in Human Behavior"
    core_concept: |
      SDT提出人类有三种基本心理需求，满足程度决定内在动机水平：
      ①自主性(Autonomy) — 感到行为是自我选择的，非被迫
      ②胜任感(Competence) — 感到有能力应对挑战，有效行动
      ③归属感(Relatedness) — 感到与他人有连接，被理解和接纳
      当三种需求被满足时，产生内在动机(intrinsic motivation)，行为持久且高质量；
      当被阻碍时，转为外在动机(extrinsic motivation)，行为短暂且易倦怠。
    metrics:
      - id: autonomy_score
        name: 自主性得分
        formula: "基于主动选择的活动比例 (非被动响应如邮件/即时消息)"
        range: [0, 100]
      - id: competence_score
        name: 胜任感得分
        formula: "基于完成度(专注段结束+产出) vs 中断率"
        range: [0, 100]
      - id: relatedness_score
        name: 归属感得分
        formula: "基于协作活动(会议/沟通)占比和多样性"
        range: [0, 100]
      - id: intrinsic_motivation_index
        name: 内在动机指数
        formula: "(自主*0.4 + 胜任*0.35 + 归属*0.25)"
        range: [0, 100]
    data_signals:
      - "主动打开开发工具并持续工作 → 自主性+"
      - "被通知/消息打断后切换 → 自主性-"
      - "完整完成一个专注段 → 胜任感+"
      - "频繁中断未完成 → 胜任感-"
      - "有团队沟通但不过多 → 归属感+"
      - "完全没有社交/协作 → 归属感-"
    insights_templates:
      high_autonomy: "今日自主性得分{score}，{pct:.0%}的工作时间是主动发起的。Deci & Ryan(1985)研究表明，自主性是内在动机最强的预测因子。"
      low_competence: "今日有{interrupts}次中断未恢复，胜任感得分{score}。SDT指出，当个体反复感到'做不完'时，会降低自我效能感，形成恶性循环。建议减少同时任务数。"
      isolation: "连续{days}天协作活动<10%，归属感需求未被满足。SDT研究表明社会隔离会降低工作满意度和创造力。即便远程工作，定期的同步沟通也很重要。"

  # ━━━ 5. 超日节律 (Ultradian Rhythm) ━━━━━━━━━━━━━━━━━━━━━
  - id: ultradian_rhythm
    name: 超日节律
    name_en: Ultradian Rhythm
    field: 生理心理学/时间管理
    scholar: Basic Rest-Activity Cycle (BRAC), Ernst Rossi
    year: 1991
    source_book: "The 20-Minute Break, Ernst Rossi"
    core_concept: |
      人体的超日节律(BRAC)以90-120分钟为一个周期：高能期(约70分钟)后跟随低能期(约20分钟)。
      在高能期专注工作，在低能期主动休息，可以最大化工作效率和避免下午崩溃。
      违背节律强行工作会导致：认知下降、错误增加、情绪烦躁、恢复时间加倍。
    metrics:
      - id: rhythm_alignment
        name: 节律对齐度
        formula: "高能期专注工作时长 / 总高能期时长"
        range: [0, 1]
      - id: rest_adequacy
        name: 休息充足度
        formula: "实际休息段数 / 理论需要休息段数(工作时长/90min)"
        range: [0, 1]
      - id: afternoon_crash_risk
        name: 下午崩溃风险
        formula: "基于午餐后持续工作时长和之前累计工作时长"
        range: [0, 100]
    data_signals:
      - "连续工作>90分钟无休息 → 节律违反"
      - "下午2-3点效率骤降 → 可能崩溃区"
      - "午间有明确休息 → 节律友好"
    insights_templates:
      no_rest: "连续工作{minutes}分钟未休息，超过90分钟超日节律周期。Rossi(1991)建议每70-90分钟主动休息15-20分钟，而非等到疲惫才停。"
      crash_risk: "午间工作{hours}小时后仅休息{rest_min}分钟，下午崩溃风险为{risk}。研究显示午餐后20分钟休息可恢复50%的认知能力。"
      good_rhythm: "今日工作-休息节律良好，平均每{interval}分钟有一个自然休息点，符合超日节律的90分钟周期。"

  # ━━━ 6. 深度工作 (Deep Work) ━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: deep_work
    name: 深度工作
    name_en: Deep Work
    field: 生产力/认知科学
    scholar: Cal Newport
    year: 2016
    source_book: "Deep Work: Rules for Focused Success in a Distracted World"
    core_concept: |
      Newport定义深度工作为：在无干扰状态下进行的专业活动，将认知能力推向极限。
      这种努力创造新价值、提升技能，且难以复制。
      浅层工作(Shallow Work)则是：在注意力分散中进行的非认知密集型后勤或事务性任务，
      通常不会创造新价值，且容易复制。
      Newport的核心公式：深度工作产出 = 深度工作时间 × 深度工作强度
    metrics:
      - id: deep_work_ratio
        name: 深度工作比
        formula: "深度工作时长(连续>30分钟专注同一高认知任务) / 总工作时长"
        range: [0, 1]
        interpretation:
          high: ">=0.5: 深度工作占比优秀，符合Newport对高产者的描述"
          medium: "0.25-0.49: 有深度工作但被浅层工作侵蚀"
          low: "<0.25: 大部分时间在浅层工作，长期产出受限"
      - id: shallow_work_ratio
        name: 浅层工作比
        formula: "浅层任务时长 / 总工作时长"
        range: [0, 1]
    data_signals:
      - "连续>30分钟开发/设计/数据分析 → 深度工作"
      - "频繁切换邮件/聊天/审批 → 浅层工作"
      - "会议>2h/天 → 浅层工作为主的信号"
    insights_templates:
      deep_work_good: "深度工作比{ratio:.0%}，Newport(2016)指出，顶尖专家(如Carl Jung在塔楼写作)通常保持50%以上的深度工作时间。"
      too_shallow: "今日浅层工作占比{ratio:.0%}，如果长期如此，Newport警告会导致'永久性注意力损害'——大脑失去长时间专注的能力。建议每天至少保留2小时不被打断的深度时间块。"

  # ━━━ 7. 结构洞/社会资本理论 ━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: structural_holes
    name: 结构洞与社会资本
    name_en: Structural Holes & Social Capital
    field: 社会学/组织行为学
    scholar: Ronald S. Burt
    year: 1992
    source_book: "Structural Holes: The Social Structure of Competition"
    core_concept: |
      Burt的结构洞理论指出：在社交网络中，连接不同社群(跨越结构洞)的人拥有信息优势。
      Granovetter的"弱关系的力量"(1973)进一步说明：非紧密联系的弱关系更可能提供新信息和新机会。
      对开发者而言：仅在同一技术栈内交流=信息茧房；跨领域交流=结构洞桥接者=竞争优势。
    metrics:
      - id: tool_diversity
        name: 工具多样性指数
        formula: "Shannon多样性指数 H = -Σ(p_i * ln(p_i)), p_i为工具i的使用占比"
        range: [0, 3.5]
      - id: cross_domain_index
        name: 跨域连接指数
        formula: "涉及的不同一级分类数 / 总分类数"
        range: [0, 1]
      - id: knowledge_bridging
        name: 知识桥接度
        formula: "跨分类切换次数 * 多样性权重"
        range: [0, 50]
    data_signals:
      - "使用5种以上不同工具 → 多样性+"
      - "连续多日只在一个分类 → 信息茧房信号"
      - "开发+设计+产品间切换 → 跨域桥接"
    insights_templates:
      low_diversity: "工具多样性指数{diversity}，集中使用{top_tool}占{pct:.0%}。Burt(1992)将此称为'网络闭合'——过度专注于一个领域会限制信息获取。Granovetter(1973)指出弱关系(跨界连接)是新机会的主要来源。"
      bridge: "今日跨{domains}个领域工作，属于结构洞桥接者角色。Burt的研究表明，这类人在组织中更容易获得晋升和创新机会。"

  # ━━━ 8. 最近发展区 (ZPD) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: zpd
    name: 最近发展区
    name_en: Zone of Proximal Development
    field: 教育心理学/发展心理学
    scholar: Lev Vygotsky
    year: 1978
    source_book: "Mind in Society: The Development of Higher Psychological Processes"
    core_concept: |
      Vygotsky定义ZPD为："独立解决问题的实际发展水平"与"在成人指导下或有经验同伴协作下
      解决问题的潜在发展水平"之间的差距。
      教学的最佳区域不是学生已掌握的(舒适区)，也不是完全超出能力的(恐慌区)，
      而是ZPD——稍有挑战但可达的区域。在ZPD中工作，学习效率最高。
    metrics:
      - id: challenge_match_ratio
        name: 挑战匹配度
        formula: "在已知领域+新工具/新方法的活动时长 / 学习类总时长"
        range: [0, 1]
      - id: zpd_alignment
        name: ZPD对齐度
        formula: "基于活动分类的变化率和新元素占比推算"
        range: [0, 100]
    data_signals:
      - "已知领域+新工具 → ZPD内(最佳学习区)"
      - "完全陌生的分类且无积累 → 可能在恐慌区"
      - "完全相同的重复 → 舒适区，无成长"
    insights_templates:
      in_zpd: "当前工作模式处于最近发展区内——在熟悉的{domain}领域使用新方法/工具。Vygotsky(1978)指出这是认知发展的最优区间，学习效率是舒适区的3-5倍。"
      comfort_only: "连续{days}天工作内容无新元素，已完全进入舒适区。Vygotsky的ZPD理论警示：长期停留在舒适区会导致'发展停滞'，需要适度增加挑战。"

  # ━━━ 9. 习惯回路与行为设计 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: habit_loop
    name: 习惯回路与行为设计
    name_en: Habit Loop & Behavior Design
    field: 行为心理学/行为经济学
    scholar: Charles Duhigg / BJ Fogg / James Clear
    year: 2012/2019
    source_books:
      - "The Power of Habit, Charles Duhigg (2012)"
      - "Tiny Habits, BJ Fogg (2019)"
      - "Atomic Habits, James Clear (2018)"
    core_concept: |
      Duhigg的习惯回路：提示(Cue) → 惯例(Routine) → 奖励(Reward)
      Fogg的行为模型：B = MAP (Behavior = Motivation × Ability × Prompt)
      Clear的习惯定律：①让它显而易见 ②让它有吸引力 ③让它简便 ④让它满足
      习惯形成的研究显示：平均66天(Lally et al., 2010)，范围18-254天
    metrics:
      - id: habit_consistency
        name: 习惯一致性
        formula: "连续天数 / 66(研究中位数) * 100"
        range: [0, 385]
      - id: routine_stability
        name: 常规稳定性
        formula: "每日相似时段做相似任务的比例"
        range: [0, 1]
      - id: cue_analysis
        name: 触发线索分析
        formula: "基于时间/应用序列的模式检测"
        range: qualitative
    data_signals:
      - "每天上午9-10点开始编码 → 时间提示(Cue)"
      - "打开IDE后总是先看某个项目 → 环境提示"
      - "连续3天以上同一时段同一活动 → 习惯候选"
    insights_templates:
      habit_forming: "检测到{activity}在{time}连续{days}天出现，符合习惯形成模式。Lally et al.(2010)研究显示平均需要66天形成稳定习惯，当前进度{progress:.0%}。"
      broken_chain: "之前连续{days}天的{activity}习惯今天中断。Clear(2018)建议'不要连续错过两次'——一次中断不会摧毁习惯，但两次连续中断开始瓦解回路。"

  # ━━━ 10. 心理资本 (PsyCap) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: psychological_capital
    name: 心理资本
    name_en: Psychological Capital (PsyCap)
    field: 积极心理学/组织行为学
    scholar: Fred Luthans / Carolyn Youssef-Morgan
    year: 2007
    source_book: "Psychological Capital: Developing the Human Competitive Edge"
    core_concept: |
      心理资本(PsyCap)由四个维度构成(HERO)：
      H - 希望(Hope)：有意愿和路径达成目标
      E - 自我效能(Efficacy)：相信自己能完成挑战性任务
      R - 韧性(Resilience)：从挫折中恢复的能力
      O - 乐观(Optimism)：对结果持积极预期
      Luthans的研究证明PsyCap与工作绩效的相关系数为0.3-0.5，且可被开发提升。
    metrics:
      - id: hope_score
        name: 希望得分
        formula: "基于目标设定活动(计划/排期)和路径多样性(工具/方法)" 
        range: [0, 100]
      - id: efficacy_score
        name: 自我效能得分
        formula: "基于任务完成率和挑战任务的成功比例"
        range: [0, 100]
      - id: resilience_score
        name: 韧性得分
        formula: "基于中断后恢复工作的速度和比例"
        range: [0, 100]
      - id: optimism_score
        name: 乐观指数
        formula: "基于工作时段选择(主动选择高能时段 vs 被动应付)"
        range: [0, 100]
      - id: psycap_index
        name: 心理资本综合指数
        formula: "(希望+效能+韧性+乐观) / 4"
        range: [0, 100]
    data_signals:
      - "有计划行为 → 希望+"
      - "完成挑战性任务 → 效能+"
      - "中断后快速恢复 → 韧性+"
      - "主动选择工作而非应付 → 乐观+"
      - "长时间中断后未恢复 → 韧性-"
    insights_templates:
      high_psycap: "心理资本指数{score}，HERO四维度均衡。Luthans(2007)研究表明PsyCap每提升1个标准差，工作绩效提升约20%，且心理资本是可训练的。"
      low_resilience: "韧性维度得分{score}——中断后平均{minutes}分钟才恢复工作。Seligman的习得性乐观研究指出，'解释风格'的调整(将挫折视为暂时的、特定的、外在的)可有效提升韧性。"
      efficacy_gap: "自我效能得分{score}。Bandura(1997)指出四种提升途径：①掌握性经验(最重要的) ②替代性经验 ③社会说服 ④情绪唤醒。建议通过分解任务积累小胜利来提升。"

      low_resilience: "韧性维度得分{score}——中断后平均{minutes}分钟才恢复工作。Seligman的习得性乐观研究指出，'解释风格'的调整(将挫折视为暂时的、特定的、外在的)可有效提升韧性。"
      efficacy_gap: "自我效能得分{score}。Bandura(1997)指出四种提升途径：①掌握性经验(最重要的) ②替代性经验 ③社会说服 ④情绪唤醒。建议通过分解任务积累小胜利来提升。"

  # ━━━ 11. MBTI 人格推断 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: mbti_inference
    name: MBTI 人格推断
    name_en: MBTI Personality Inference
    field: 人格心理学
    scholar: Isabel Briggs Myers & Katharine Cook Briggs
    year: 1962
    source_book: "MBTI Manual (Myers & McCaulley, 1985)"
    core_concept: |
      MBTI 基于荣格的心理类型理论，将人格分为4个维度8个偏好：
      E/I — 外向(Extraversion) vs 内向(Introversion)：能量来源
      S/N — 感觉(Sensing) vs 直觉(iNtuition)：信息获取方式
      T/F — 思考(Thinking) vs 情感(Feeling)：决策方式
      J/P — 判断(Judging) vs 知觉(Perceiving)：生活方式
      工作行为数据可间接反映偏好：如持续深度工作→I偏好，频繁沟通→E偏好，
      多工具探索→N偏好，重复稳定操作→S偏好。
    metrics:
      - id: ei_score
        name: E/I 偏好得分
        formula: "(独立工作时长比例 vs 协作沟通时长比例) 归一化到 -50~+50"
        range: [-50, 50]
        interpretation:
          introvert: "≤-10: 偏内向(I)，从独处中获取能量"
          ambivert: "-10~10: 中间型，根据情境切换"
          extravert: "≥10: 偏外向(E)，从社交中获取能量"
      - id: sn_score
        name: S/N 偏好得分
        formula: "(新工具/新领域探索比例 vs 重复熟悉操作比例) 归一化"
        range: [-50, 50]
      - id: tf_score
        name: T/F 偏好得分
        formula: "(逻辑分析类活动 vs 人际沟通类活动比例) 归一化"
        range: [-50, 50]
      - id: jp_score
        name: J/P 偏好得分
        formula: "(计划性/完成率 vs 灵活切换/探索比例) 归一化"
        range: [-50, 50]
      - id: mbti_type
        name: 推断 MBTI 类型
        formula: "组合四维度偏好方向的4字母代码"
        range: 16 types
    data_signals:
      - "长时间独立深度工作 → I偏好"
      - "频繁会议+主动沟通 → E偏好"
      - "持续使用新工具/新方法 → N偏好"
      - "稳定重复同一工作流 → S偏好"
      - "数据分析/架构设计为主 → T偏好"
      - "团队协调/需求沟通为主 → F偏好"
      - "高完成率+计划性工作 → J偏好"
      - "灵活切换+多线程探索 → P偏好"
    insights_templates:
      type_inferred: "基于工作行为数据推断你的MBTI类型倾向为{mbti_type}，四维度偏好：E/I={ei}，S/N={sn}，T/F={tf}，J/P={jp}。注意：MBTI应作为理解偏好的框架，而非刻板标签。"
      introvert_deep: "独立工作占比{pct:.0%}，符合内向(I)偏好特征。Myers指出I偏好者通过独处恢复能量，在深度工作中表现更优。"
      intuitive_explore: "工具多样性指数{diversity}，新工具探索频繁，符合直觉(N)偏好。N偏好者倾向于关注可能性和模式，而非仅关注当下事实。"

  # ━━━ 12. 荣格八维认知功能 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: jungian_functions
    name: 荣格八维认知功能
    name_en: Jungian Cognitive Functions
    field: 分析心理学
    scholar: Carl G. Jung
    year: 1921
    source_book: "Psychological Types, C.G. Jung (1921)"
    core_concept: |
      荣格提出8种认知功能，分为感知功能(S/N)和判断功能(T/F)，各有外向(e)和内向(i)态度：
      Se — 外向感觉：关注当下感官体验和实际行动
      Si — 内向感觉：依赖内部经验库和已验证方法
      Ne — 外向直觉：探索可能性、联系和模式
      Ni — 内向直觉：内部洞察、长期愿景和意义
      Te — 外向思考：系统化组织、效率、客观标准
      Ti — 内向思考：逻辑框架、原理分析、精确性
      Fe — 外向情感：社交和谐、他人需求、团队氛围
      Fi — 内向情感：个人价值、真实性和内在准则
      每种MBTI类型有独特的功能栈（主导→辅助→第三→劣势）。
    metrics:
      - id: se_score
        name: Se 外向感觉
        formula: "即时响应/快速切换活动占比"
        range: [0, 100]
      - id: si_score
        name: Si 内向感觉
        formula: "重复模式/稳定工作流占比"
        range: [0, 100]
      - id: ne_score
        name: Ne 外向直觉
        formula: "跨域探索/工具多样性/新尝试频率"
        range: [0, 100]
      - id: ni_score
        name: Ni 内向直觉
        formula: "长期专注同一主题/深度洞察类活动"
        range: [0, 100]
      - id: te_score
        name: Te 外向思考
        formula: "组织管理/效率优化/项目管理类活动"
        range: [0, 100]
      - id: ti_score
        name: Ti 内向思考
        formula: "分析/调试/架构设计/逻辑推理类活动"
        range: [0, 100]
      - id: fe_score
        name: Fe 外向情感
        formula: "团队沟通/协调/社交类活动占比"
        range: [0, 100]
      - id: fi_score
        name: Fi 内向情感
        formula: "个人项目/学习/独立创造性活动"
        range: [0, 100]
    data_signals:
      - "快速响应即时消息 → Se 信号"
      - "每天固定时段重复相同工作流 → Si 信号"
      - "同时探索多个新工具/新领域 → Ne 信号"
      - "长时间钻研单一复杂问题 → Ni 信号"
      - "排优先级+项目规划 → Te 信号"
      - "深度调试+底层分析 → Ti 信号"
      - "主动沟通协调团队 → Fe 信号"
      - "独立个人驱动项目 → Fi 信号"
    insights_templates:
      dominant_function: "主导认知功能推断为{dominant_func}（得分{score}），这解释了你{explanation}的工作模式。Jung指出主导功能是意识的核心，约60-70%的精力由其驱动。"
      function_stack: "功能栈推断：{stack}。辅助功能{auxiliary}为你的主导功能提供平衡，而劣势功能{inferior}在压力下可能浮现。"

  # ━━━ 13. 大五人格维度 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: big_five
    name: 大五人格维度
    name_en: Big Five Personality Traits (OCEAN)
    field: 人格心理学
    scholar: Costa & McCrae
    year: 1992
    source_book: "Revised NEO Personality Inventory (NEO-PI-R)"
    core_concept: |
      大五模型是人格心理学中最广泛验证的特质模型，包含5个正交维度：
      O — 开放性(Openness)：创新、探索、审美、好奇心
      C — 尽责性(Conscientiousness)：自律、计划、条理、可靠
      E — 外向性(Extraversion)：社交、活力、果断、积极情绪
      A — 宜人性(Agreeableness)：合作、信任、利他、温和
      N — 神经质(Neuroticism)：焦虑、脆弱、情绪不稳定
      每个维度是连续谱而非二分法，工作中可从行为数据间接推断。
      Costa & McCrae(1992)元分析显示大五与工作绩效有显著相关。
    metrics:
      - id: openness_score
        name: 开放性(O)得分
        formula: "(新工具使用率 + 跨域切换频率 + 非常规时段工作) 综合评分"
        range: [0, 100]
      - id: conscientiousness_score
        name: 尽责性(C)得分
        formula: "(任务完成率 + 工作规律性 + 计划执行度) 综合评分"
        range: [0, 100]
      - id: extraversion_score
        name: 外向性(E)得分
        formula: "(协作活动占比 + 主动沟通频率) 综合评分"
        range: [0, 100]
      - id: agreeableness_score
        name: 宜人性(A)得分
        formula: "(响应速度 + 会议参与度 + 协作配合度) 综合评分"
        range: [0, 100]
      - id: neuroticism_score
        name: 神经质(N)得分
        formula: "(中断频率 + 非规律时段工作情绪 + 恢复速度) 逆向评分"
        range: [0, 100]
    data_signals:
      - "频繁试用新工具/新方法 → O+"
      - "严格按时间表工作 → C+"
      - "主动发起沟通/会议 → E+"
      - "迅速响应他人请求 → A+"
      - "频繁中断+恢复慢 → N+"
      - "稳定不中断专注 → N-"
    insights_templates:
      high_openness: "开放性得分{score}，工具多样性指数{diversity}，跨{domains}个领域工作。Costa & McCrae(1992)指出高开放性与创造力和学习速度正相关。"
      high_conscientiousness: "尽责性得分{score}，习惯一致性{consistency}%，任务完成率{completion_rate}%。Barrick & Mount(1991)元分析发现尽责性是唯一所有职业都预测绩效的大五维度。"
      high_neuroticism: "神经质维度得分{score}，今日{interrupts}次中断且平均恢复时间{recovery_min}分钟。研究表明适度的情绪敏感性可以提升对问题的警觉性，但需注意工作-休息平衡。"

  # ━━━ 14. 认知风格分析 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - id: cognitive_style
    name: 认知风格分析
    name_en: Cognitive Style Analysis
    field: 认知心理学
    scholar: Riding & Cheema
    year: 1991
    source_paper: "Cognitive Style — An Overview and Integration, Educational Psychology"
    core_concept: |
      Riding & Cheema(1991)将认知风格归纳为两个独立维度：
      1. 整体-分析(Wholist-Analytic)：信息组织方式
         整体型：先看全局再关注细节，偏好宏观框架
         分析型：先关注细节再构建整体，偏好逐步分解
      2. 言语-表象(Verbal-Imager)：信息表征方式
         言语型：以文字和概念思考，偏好文档和文字沟通
         表象型：以图像和空间思考，偏好可视化和设计
      此外，Kagan(1964)的反思-冲动维度也很相关：
      反思型：考虑周全后行动，偏好深度分析
      冲动型：快速行动，偏好快速迭代和试错
    metrics:
      - id: wholist_analytic_score
        name: 整体-分析维度
        formula: "(跨域切换频率 vs 深度单域专注) 归一化"
        range: [-50, 50]
        interpretation:
          wholist: "≤-10: 偏整体型，擅长把握全局和跨领域联系"
          balanced: "-10~10: 平衡型，灵活切换"
          analytic: "≥10: 偏分析型，擅长深度分解和精确执行"
      - id: verbal_imager_score
        name: 言语-表象维度
        formula: "(文档/代码占比 vs 设计/可视化占比) 归一化"
        range: [-50, 50]
      - id: reflective_impulsive_score
        name: 反思-冲动维度
        formula: "(平均决策时长 vs 快速试错频率) 归一化"
        range: [-50, 50]
    data_signals:
      - "频繁跨域切换+概览多项目 → 整体型"
      - "长时间深度钻研单一领域 → 分析型"
      - "大量文档/代码/笔记活动 → 言语型"
      - "设计/可视化/原型活动 → 表象型"
      - "长时间考虑后执行 → 反思型"
      - "快速切换+频繁试错 → 冲动型"
    insights_templates:
      analytic_style: "认知风格偏分析型（得分{score}），每次专注{focus_min}分钟深入单一领域。Riding(1991)指出分析型在需要精确性的任务中表现更优，但可能忽略全局联系。"
      wholist_style: "认知风格偏整体型（得分{score}），每日跨{domains}个领域切换。整体型善于发现跨领域联系，但在需要精确细节时可能失误。"

  # ━━━ 工具分类映射：用于计算各框架指标 ━━━━━━━━━━━━━━━━━━━━━
category_profiles:
  开发:
    bloom_levels: [3, 6]  # 应用到创造
    flow_relevant: true
    deep_work_eligible: true
    deliberate_practice_zone: learning  # 新项目=学习区, 重复=舒适区
    sdt_nature: autonomous  # 通常是自主选择
  会议:
    bloom_levels: [2, 4]
    flow_relevant: false
    deep_work_eligible: false
    deliberate_practice_zone: comfort
    sdt_nature: relatedness
  沟通:
    bloom_levels: [2, 5]
    flow_relevant: false
    deep_work_eligible: false
    deliberate_practice_zone: comfort
    sdt_nature: relatedness
  文档:
    bloom_levels: [2, 5]
    flow_relevant: true
    deep_work_eligible: true
    deliberate_practice_zone: comfort
    sdt_nature: mixed
  测试:
    bloom_levels: [3, 4]
    flow_relevant: true
    deep_work_eligible: true
    deliberate_practice_zone: learning
    sdt_nature: mixed
  设计:
    bloom_levels: [5, 6]
    flow_relevant: true
    deep_work_eligible: true
    deliberate_practice_zone: learning
    sdt_nature: autonomous
  运维:
    bloom_levels: [3, 4]
    flow_relevant: true
    deep_work_eligible: true
