name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xiaohei-daily
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Syntax check
        run: |
          python -m py_compile main.py server.py db.py config.py
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -q --maxfail=5

  frontend:
    name: Frontend (TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xiaohei-daily/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiaohei-daily/client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
