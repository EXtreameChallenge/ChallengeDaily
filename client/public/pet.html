<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>ChallengeDaily</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .pet {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .pet:hover {
      transform: scale(1.1);
    }
    .speech-bubble {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #212121;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      font-family: "Microsoft YaHei", sans-serif;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .speech-bubble.show {
      opacity: 1;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(255, 255, 255, 0.95);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .bouncing {
      animation: bounce 0.6s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="pet" id="pet">
    <div class="speech-bubble" id="bubble">该休息一下啦~</div>
    🐱
  </div>
  <script>
    const pet = document.getElementById('pet');
    const bubble = document.getElementById('bubble');
    const messages = [
      '努力工作中~',
      '该休息一下啦~',
      '喝口水吧 💧',
      '今天进展不错！',
      '专注模式开启！',
      '别忘了起来走走~',
      '加油加油！',
      '需要我帮你写日报吗？',
    ];

    let bounceTimeout = null;

    pet.addEventListener('click', () => {
      pet.classList.add('bouncing');
      setTimeout(() => pet.classList.remove('bouncing'), 600);

      const msg = messages[Math.floor(Math.random() * messages.length)];
      bubble.textContent = msg;
      bubble.classList.add('show');
      clearTimeout(bounceTimeout);
      bounceTimeout = setTimeout(() => bubble.classList.remove('show'), 3000);
    });

    // 定时提醒（每 45 分钟）
    setInterval(() => {
      bubble.textContent = '该休息一下啦~ 🎯';
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 5000);
    }, 45 * 60 * 1000);

    // 初始打招呼
    setTimeout(() => {
      bubble.textContent = 'ChallengeDaily 陪你~';
      bubble.classList.add('show');
      setTimeout(() => bubble.classList.remove('show'), 3000);
    }, 2000);
  </script>
</body>
</html>
