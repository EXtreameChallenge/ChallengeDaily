<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>番茄钟</title>
  <style>
    /* ── 项目字体：Anthropic Mono（数字）+ 方正清刻本悦宋（中文）── */
    @font-face {
      font-family: 'Anthropic Mono';
      src: url('./fonts/anthropic-mono.woff2') format('woff2');
      font-weight: 300 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'FZQingKeBenYueSong';
      src: url('./fonts/方正清刻本悦宋简体.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      font-family: 'FZQingKeBenYueSong', 'Microsoft YaHei', serif;
    }
    .widget {
      position: relative;
      width: 216px;
      height: 94px;
      border-radius: 14px;
      background: rgba(24, 24, 32, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(147, 124, 255, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 9px 14px 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      cursor: pointer;
      transition: border-color .3s ease;
    }
    .widget:hover { border-color: rgba(147, 124, 255, 0.7); }

    /* ── 顶行：阶段 + 番茄进度 ── */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .phase {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: none;
    }
    .dot.working { background: #937CFF; animation: pulse 1.6s ease-in-out infinite; }
    .dot.break { background: #34d399; }
    .dot.long-break { background: #38bdf8; }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(147,124,255,.5); }
      50% { opacity: .55; box-shadow: 0 0 0 4px rgba(147,124,255,0); }
    }
    .phase-text.working { color: #B8A8FF; }
    .phase-text.break { color: #34d399; }
    .phase-text.long-break { color: #38bdf8; }
    .phase-text.idle { color: rgba(255,255,255,.4); }

    .pomo-count {
      font-size: 11px;
      color: #F0C040;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── 倒计时：项目等宽字体 ── */
    .timer {
      font-family: 'Anthropic Mono', 'Consolas', monospace;
      font-size: 30px;
      font-weight: 700;
      color: #F5F0E8;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-align: center;
      letter-spacing: 1px;
    }

    /* ── 底行：任务名 + 分心计数 ── */
    .task-name {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .distract {
      font-size: 10px;
      color: #E54D42;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ── 进度条 ── */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s linear;
    }
    .progress-fill.working { background: linear-gradient(90deg, #7B68EE, #B8A8FF); }
    .progress-fill.break { background: linear-gradient(90deg, #059669, #34d399); }
    .progress-fill.long-break { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="row">
      <span class="phase">
        <i class="dot working" id="dot"></i>
        <span class="phase-text working" id="phaseLabel">专注中</span>
      </span>
      <span class="pomo-count" id="pomoCount" hidden>🍅 0/1</span>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="row">
      <span class="task-name" id="taskName"></span>
      <span class="distract" id="distract" hidden>分心 0</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill working" id="progressFill" style="width: 0%"></div>
    </div>
  </div>
  <!-- 外链 JS：生产模式 CSP script-src 'self' 禁止内联脚本 -->
  <script src="./pomodoro-widget.js"></script>
</body>
</html>
