<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>番茄钟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI', sans-serif;
    }
    .widget {
      width: 200px;
      height: 80px;
      border-radius: 16px;
      background: rgba(30, 30, 46, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(123, 104, 238, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .phase-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .phase-label.working { color: #a78bfa; }
    .phase-label.break { color: #34d399; }
    .phase-label.long-break { color: #38bdf8; }
    .timer {
      font-size: 32px;
      font-weight: 700;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .task-name {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    /* 进度条 */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s linear;
    }
    .progress-fill.working { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
    .progress-fill.break { background: linear-gradient(90deg, #059669, #34d399); }
    .progress-fill.long-break { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="phase-label working" id="phaseLabel">专注中</div>
    <div class="timer" id="timer">25:00</div>
    <div class="task-name" id="taskName"></div>
    <div class="progress-bar">
      <div class="progress-fill working" id="progressFill" style="width: 0%"></div>
    </div>
  </div>
  <script>
    const phaseLabel = document.getElementById('phaseLabel')
    const timer = document.getElementById('timer')
    const taskName = document.getElementById('taskName')
    const progressFill = document.getElementById('progressFill')

    let latestData = { phase: 'idle', remaining: 0, totalSec: 0, task: '', duration: 25 }

    // 接收主进程发来的计时数据
    window.electronAPI?.onPomodoroTick?.((data) => {
      latestData = data
      render(data)
    })

    function render(data) {
      const mins = Math.floor(data.remaining / 60)
      const secs = data.remaining % 60
      timer.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0')

      const phase = data.phase || 'idle'
      const isWorking = phase === 'working'
      const isLongBreak = phase === 'long_break'
      // 专注中 / 短休息 / 长休息 / 空闲
      if (phase === 'idle') {
        phaseLabel.textContent = '空闲'
        phaseLabel.className = 'phase-label'
      } else if (isWorking) {
        phaseLabel.textContent = '专注中'
        phaseLabel.className = 'phase-label working'
      } else if (isLongBreak) {
        phaseLabel.textContent = '长休息'
        phaseLabel.className = 'phase-label long-break'
      } else {
        phaseLabel.textContent = '短休息'
        phaseLabel.className = 'phase-label break'
      }
      progressFill.className = 'progress-fill ' + (isWorking ? 'working' : isLongBreak ? 'long-break' : 'break')

      const pct = data.totalSec > 0 ? ((data.totalSec - data.remaining) / data.totalSec * 100) : 0
      progressFill.style.width = pct + '%'

      taskName.textContent = data.task || ''
    }

    // 本地每秒递减（避免频繁 IPC 通信）
    setInterval(() => {
      if (latestData.phase === 'idle' || latestData.remaining <= 0) return
      latestData.remaining -= 1
      if (latestData.remaining < 0) latestData.remaining = 0
      render(latestData)
    }, 1000)
  </script>
</body>
</html>
